<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Core brand gradient -->
    <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <!-- Accent gradient for the AI badge/node -->
    <linearGradient id="accentGrad" x1="18" y1="3" x2="29" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle drop shadow filter for professional depth -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Top-Left (Standard Brand Color) -->
    <rect x="3" y="3" width="11" height="11" rx="3.5" fill="url(#brandGrad)" />
    
    <!-- Top-Right (Accent Cyan/Blue Node to represent AI/Cloud intelligence) -->
    <rect x="18" y="3" width="11" height="11" rx="3.5" fill="url(#accentGrad)" />
    
    <!-- Bottom-Left (Standard Brand Color) -->
    <rect x="3" y="18" width="11" height="11" rx="3.5" fill="url(#brandGrad)" />
    
    <!-- Bottom-Right (Standard Brand Color) -->
    <rect x="18" y="18" width="11" height="11" rx="3.5" fill="url(#brandGrad)" />
  </g>
</svg>